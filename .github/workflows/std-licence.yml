name: Apply licence headers
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
jobs:
  apply:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/std-licence')
    runs-on: ubuntu-latest
    concurrency:
      group: stdlicence-${{ github.event.issue.number }}
    steps:
      - uses: moodyjmz/licence-gate-tooling/actions/std-licence@f406f21a223d2cb67b3b2d3a7b6a8b90151e51ac
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
