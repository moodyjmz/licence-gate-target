name: Apply licence headers
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
jobs:
  apply:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/std-licence')
    runs-on: ubuntu-latest
    concurrency:
      group: stdlicence-${{ github.event.issue.number }}
    steps:
      - uses: moodyjmz/licence-gate-tooling/actions/std-licence@75d994203742bbf3dfdd0eac0f1b640dff3ef38a
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
