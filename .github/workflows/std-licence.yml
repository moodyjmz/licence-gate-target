name: Apply licence headers
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
jobs:
  apply:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/std-licence')
    runs-on: ubuntu-latest
    concurrency:
      group: stdlicence-${{ github.event.issue.number }}
    steps:
      - uses: moodyjmz/licence-gate-tooling/actions/std-licence@83c2fe11a4f5a6c7a8fd0502f725dee53db1abd4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
