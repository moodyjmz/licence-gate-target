name: Apply licence headers
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
jobs:
  apply:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/std-licence')
    runs-on: ubuntu-latest
    concurrency:
      group: stdlicence-${{ github.event.issue.number }}
    steps:
      - uses: moodyjmz/licence-gate-tooling/actions/std-licence@3dccb366374ec647aa2a7f7481f9fbdcbb210e82
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
