name: Acknowledgement gate
on:
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  acknowledgement-gate:
    # issue_comment fires for issues too; only act on pull requests
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    concurrency:
      group: ack-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: moodyjmz/licence-gate-tooling/actions/acknowledgement@1865de2e0ae798ca42a620761c66ca7787f38381
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          register-prefix: 'example-log:'
