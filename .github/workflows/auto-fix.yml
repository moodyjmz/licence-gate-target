name: Auto-fix
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
jobs:
  fix:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/auto-fix')
    runs-on: ubuntu-latest
    concurrency:
      group: autofix-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # No checkout here: the action checks out the pull request branch itself, after
      # it has decided the commenter is allowed to make it do that.
      - uses: moodyjmz/licence-gate-tooling/actions/auto-fix@75d994203742bbf3dfdd0eac0f1b640dff3ef38a
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
